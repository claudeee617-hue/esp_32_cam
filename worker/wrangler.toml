name = "esp32-cam-iot"
main = "src/index.js"
compatibility_date = "2026-11-17"

[assets]
directory = "../dashboard"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Create a D1 database with:
#   npx wrangler d1 create esp32-cam-events
# Then replace the database_id below with the returned ID and uncomment.
# [[d1_databases]]
# binding = "DB"
# database_name = "esp32-cam-events"
# database_id = "REPLACE_WITH_REAL_DATABASE_ID"

[observability]
enabled = true
