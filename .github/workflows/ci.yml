name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        working-directory: worker
        run: npm install
      - name: Syntax check
        working-directory: worker
        run: npm run check
